compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
enable_cpu_affinity: false
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2  # reduced from 4 to match my 2-GPU setup
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
# enable debug mode when troubleshooting hangs or errors
# debug: true
# note: enable_cpu_affinity can improve performance on NUMA systems; keeping off for now
enable_cpu_affinity: false
